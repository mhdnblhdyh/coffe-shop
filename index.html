<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Naobil Coffee – Find Your Moment</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--bg:#F1EADB;--card:rgba(255,252,246,.8);--ink:#14203C;--mut:#6B7488;--blue:#0B4FB3;--dock:rgba(255,255,255,.94);--c:#1F57C6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1526;--card:rgba(28,37,60,.82);--ink:#F2EEE4;--mut:#9AA4BC;--dock:rgba(34,44,72,.95);color-scheme:dark}:root:not([data-theme="light"]) .logo{filter:brightness(2.1) saturate(.7)}}
:root[data-theme="dark"]{--bg:#0E1526;--card:rgba(28,37,60,.82);--ink:#F2EEE4;--mut:#9AA4BC;--dock:rgba(34,44,72,.95);color-scheme:dark}
:root[data-theme="dark"] .logo{filter:brightness(2.1) saturate(.7)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);background-image:radial-gradient(900px 500px at 15% -5%,rgba(255,255,255,.55),transparent),radial-gradient(800px 500px at 100% 30%,rgba(11,79,179,.09),transparent);color:var(--ink);font:400 16px/1.55 Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.nav{max-width:1120px;margin:0 auto;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.nav .logo{height:78px;width:auto}
.nav nav{display:flex;align-items:center;gap:26px;font-weight:500;font-size:15px}
.nav a{color:inherit;text-decoration:none}
.nav a.cta{background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px}
.stage{--c:#1F57C6;--r:8% 40% 46% 8%/7% 30% 36% 7%;--ty:-50%;position:relative;max-width:1120px;width:calc(100% - 28px);min-height:620px;margin:6px auto 0;padding:18px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);border-radius:44px;background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 40px 80px -36px rgba(20,32,60,.4),inset 0 0 0 1px rgba(255,255,255,.55);overflow:hidden}
.panel{position:relative;min-height:584px}
.panel::before{content:"";position:absolute;inset:0;background:var(--c);border-radius:var(--r);transition:background .9s ease,border-radius 1s cubic-bezier(.6,0,.2,1)}
.panel h1{position:absolute;left:38px;top:50%;transform:translateY(-50%);margin:0;color:#fff;font:600 clamp(40px,5.2vw,74px)/.94 Fredoka,system-ui,sans-serif;letter-spacing:-.02em;z-index:1}
.panel h1 span{display:block}
.deco{position:absolute;pointer-events:none}
.pill{left:34px;bottom:118px;width:58px;height:30px;border-radius:30px;background:#fff;transform:rotate(-32deg);animation:wob 6s ease-in-out infinite alternate}
.cloud{left:84px;bottom:64px;width:170px;height:76px;border-radius:50%;background:rgba(255,255,255,.75);filter:blur(12px);animation:drift 8s ease-in-out infinite alternate}
.fl{position:absolute;inset:0;z-index:2;pointer-events:none;animation:float 6s ease-in-out infinite}
.shot{position:absolute;right:-92px;top:50%;width:54%;aspect-ratio:1;margin:0;border-radius:38px;overflow:hidden;transform:translateY(var(--ty)) rotate(-3deg);box-shadow:0 44px 60px -22px rgba(10,20,50,.5)}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes float{50%{transform:translateY(-12px) rotate(1.4deg)}}
.shot.out{animation:fout .42s cubic-bezier(.55,0,.85,.4) forwards}
.shot.in{animation:fin .9s cubic-bezier(.2,.9,.25,1.12) both}
@keyframes fout{to{opacity:0;transform:translate(-160%,calc(var(--ty) + 80%)) rotate(-26deg) scale(.8);filter:blur(10px)}}
@keyframes fin{from{opacity:0;transform:translate(-150%,calc(var(--ty) - 130%)) rotate(-28deg) scale(.7);filter:blur(14px)}55%{filter:blur(0)}}
.panel h1.out span{animation:tout .4s ease-in forwards}
.panel h1.in span{animation:tin .8s cubic-bezier(.2,.9,.25,1) both}.panel h1.in span+span{animation-delay:.08s}.panel h1.in span+span+span{animation-delay:.16s}
@keyframes tout{to{opacity:0;transform:translateX(-120%);filter:blur(6px)}}
@keyframes tin{from{opacity:0;transform:translateX(90%);filter:blur(8px)}}
.sats{position:absolute;inset:0;z-index:2;pointer-events:none;animation:bob 7s ease-in-out infinite alternate}
.sat{position:absolute;border-radius:50%;object-fit:cover;filter:blur(2.5px);box-shadow:0 14px 24px -8px rgba(10,20,50,.4)}
.sat:nth-child(1){left:-30px;top:30px;width:104px;height:104px}.sat:nth-child(2){left:92px;top:-22px;width:72px;height:72px;filter:blur(1.5px)}
.sats.in .sat{animation:sat 1.2s cubic-bezier(.2,.9,.25,1) both}.sats.in .sat+.sat{animation-delay:.14s}
@keyframes sat{from{opacity:0;transform:translate(-220px,-180px) scale(.4);filter:blur(16px)}}
@keyframes bob{to{transform:translate(10px,14px)}}
@keyframes drift{to{transform:translateX(18px)}}@keyframes wob{to{transform:rotate(-14deg) translateY(-8px)}}
.list{padding:26px 22px 110px 128px;display:flex;flex-direction:column;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.head h2{margin:0;font:600 34px/1.05 Fredoka,system-ui,sans-serif;letter-spacing:-.01em}
.face{width:36px;height:36px;border-radius:50%;background:#F7B733;display:grid;place-items:center;flex:none}
.desc{margin:12px 0 4px;font-size:14px;line-height:1.5;max-width:46ch;min-height:63px}
.comp{margin:0 0 14px;color:var(--mut);font-size:13px;max-width:46ch;min-height:20px}
.cats{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cat{flex:none;border:1px solid color-mix(in srgb,var(--ink) 20%,transparent);background:transparent;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500;transition:background .25s,color .25s}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:transparent}
.th{display:flex;justify-content:space-between;padding:0 14px 8px;font-size:12px;color:var(--mut);border-bottom:1px solid color-mix(in srgb,var(--ink) 10%,transparent)}
.rows{position:relative;display:flex;flex-direction:column;gap:2px;margin-top:6px;max-height:268px;overflow-y:auto;scrollbar-width:thin}
.row{flex:none;display:grid;grid-template-columns:1fr auto 52px 30px;align-items:center;gap:12px;width:100%;padding:9px 12px;border:0;background:transparent;border-radius:20px;text-align:left;font-size:14.5px;font-weight:500;transition:background .3s;cursor:pointer}
.row:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.row[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 16%,transparent)}
.row small{color:var(--mut);font-weight:400;font-size:13px}
.row img{width:52px;height:52px;object-fit:cover;border-radius:14px;display:block}
.rows.out .row{animation:rout .3s ease-in forwards}
.rows.in .row{animation:rin .65s cubic-bezier(.2,.9,.25,1) both;animation-delay:calc(var(--i)*60ms)}
@keyframes rout{to{opacity:0;transform:translateX(-60px)}}@keyframes rin{from{opacity:0;transform:translateX(70px)}}
.add{width:30px;height:30px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--ink) 25%,transparent);background:transparent;font-size:18px;line-height:1;display:grid;place-items:center;transition:transform .2s,background .2s}
.add:hover{background:var(--ink);color:var(--bg);transform:scale(1.1)}
.steps{position:absolute;left:44px;bottom:42px;display:flex;gap:5px;z-index:3}
.steps i{display:block;width:7px;height:7px;border-radius:7px;background:rgba(255,255,255,.5);transition:width .3s,background .3s}
.steps i.on{width:26px;background:#fff}
.dock{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:6px;padding:8px;border-radius:999px;background:var(--dock);box-shadow:0 18px 40px -14px rgba(20,32,60,.45)}
.ctr{min-width:62px;text-align:center;font:500 14px/1 Fredoka,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.chip{display:flex;align-items:center;gap:7px;height:44px;padding:0 15px;border:0;border-radius:999px;background:transparent;font-size:14px;font-weight:500}
.dock .sep{width:1px;height:24px;background:color-mix(in srgb,var(--ink) 15%,transparent);margin:0 4px}
.chip b{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;background:var(--ink);color:var(--bg);font-size:12px;padding:0 6px;transition:transform .25s}
.chip b.bump{transform:scale(1.35)}
.prev,.next{width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center}
.prev{background:color-mix(in srgb,var(--ink) 8%,transparent)}.next{background:var(--ink);color:var(--bg)}
.band{max-width:1120px;margin:110px auto 0;padding:0 22px}
.band h2{margin:0 0 14px;font:600 clamp(36px,5.4vw,66px)/1 Fredoka,system-ui,sans-serif;letter-spacing:-.02em;max-width:12ch}
.band p{margin:0;color:var(--mut);max-width:48ch}
.intro{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:end;margin-bottom:34px}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.strip img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;border-radius:30px;box-shadow:0 30px 50px -30px rgba(20,32,60,.5)}
.strip img:nth-child(even){margin-top:34px}.strip img:nth-child(1){border-radius:30px 90px 30px 30px}.strip img:nth-child(4){border-radius:30px 30px 90px 30px}
.duo{display:grid;grid-template-columns:1.45fr 1fr;gap:22px;margin-top:60px}
.tile{position:relative;overflow:hidden;min-height:400px;display:flex;align-items:flex-end;color:#fff}
.tile:first-child{border-radius:44px 44px 44px 120px}.tile:last-child{border-radius:28px 100px 28px 28px}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(10,18,40,.72))}
.tile div{position:relative;z-index:1;padding:28px 30px}
.tile h3{margin:0 0 4px;font:600 28px/1.1 Fredoka,system-ui,sans-serif}
.tile span{font-size:14.5px;opacity:.92}
footer{max-width:1120px;margin:110px auto 0;padding:34px 22px 56px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;border-top:1px solid color-mix(in srgb,var(--ink) 12%,transparent)}
footer .logo{height:52px;width:auto}
.takeaway{display:grid;grid-template-columns:.8fr 2.2fr;gap:34px;margin-top:80px;align-items:end}
.takeaway h3{margin:0 0 10px;font:600 clamp(30px,3.8vw,46px)/1.05 Fredoka,system-ui,sans-serif;letter-spacing:-.01em;max-width:9ch}
.pk{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.pk figure{margin:0}
.pk img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;border-radius:28px;box-shadow:0 30px 50px -30px rgba(20,32,60,.5)}
.pk figure:nth-child(2) img{border-radius:90px 28px 28px 28px}.pk figcaption{margin-top:10px;font-weight:500;font-size:14.5px}footer p{margin:0;color:var(--mut);font-size:14px}
@media (max-width:860px){
.nav nav a:not(.cta){display:none}.nav .logo{height:60px}
.stage{grid-template-columns:1fr;padding:12px;border-radius:34px}
.panel{min-height:420px}
.panel h1{top:42px;transform:none;left:26px}
.shot{width:60%;right:-18px;top:auto;bottom:-46px;--ty:0px}
.sat:nth-child(1){left:auto;right:34px;top:-26px;width:80px;height:80px}.sat:nth-child(2){left:auto;right:130px;top:-34px;width:54px;height:54px}
.steps{left:30px;bottom:26px}.pill{bottom:80px}
.list{padding:70px 6px 110px}
.intro,.takeaway{grid-template-columns:1fr}.strip{grid-template-columns:1fr 1fr}.tile{min-height:320px}
.dock{width:calc(100% - 28px);justify-content:space-between;bottom:16px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="nav">
  <a href="#menu" aria-label="Naobil Coffee"><img class="logo" data-img="logo" alt="Naobil Coffee"></a>
  <nav><a href="#menu">Menu</a><a href="#momen">Momen</a><a class="cta" href="#menu">Pesan sekarang</a></nav>
</header>

<main>
<section class="stage" id="menu" aria-label="Menu Naobil">
  <div class="panel">
    <span class="deco cloud"></span><span class="deco pill"></span>
    <h1 id="ttl"></h1>
    <div class="fl"><figure class="shot" id="shotf"><img id="shot" alt=""></figure></div>
    <div class="sats" id="sats"></div>
    <div class="steps" id="steps" aria-hidden="true"></div>
  </div>
  <div class="list">
    <div class="head"><h2>Menu<br>Naobil</h2>
      <span class="face" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M4 9c1.5 4.5 10.5 4.5 12 0" fill="none" stroke="#14203C" stroke-width="2" stroke-linecap="round"/><circle cx="7" cy="6.5" r="1.3" fill="#14203C"/><circle cx="13" cy="6.5" r="1.3" fill="#14203C"/></svg></span></div>
    <p class="desc" id="desc" aria-live="polite"></p>
    <p class="comp" id="comp"></p>
    <div class="cats" id="cats" role="group" aria-label="Kategori"></div>
    <div class="th"><span>Produk</span><span>Penyajian</span></div>
    <div class="rows" id="rows"></div>
  </div>
  <div class="dock" role="toolbar" aria-label="Kontrol menu">
    <button class="prev" id="prev" aria-label="Produk sebelumnya"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    <span class="ctr" id="ctr" aria-live="polite"></span>
    <i class="sep"></i>
    <button class="chip" id="cart" aria-label="Keranjang"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg><b id="cnt">0</b></button>
    <button class="next" id="next" aria-label="Produk berikutnya"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>
</section>

<section class="band" id="momen">
  <div class="intro"><h2>Find your moment.</h2><p>Dari es kopi susu gula aren sampai klepon coffee, 13 racikan Naobil menemani jeda kecil di hari kamu.</p></div>
  <div class="takeaway"><div><h3>Bawa pulang momennya</h3><p>Pesanan take away dikemas rapi dalam kemasan Naobil.</p></div>
    <div class="pk"><figure><img data-img="bag" alt="Paper bag Naobil"><figcaption>Paper bag</figcaption></figure><figure><img data-img="box" alt="Box take away Naobil"><figcaption>Box take away</figcaption></figure><figure><img data-img="wrap" alt="Wrap bag Naobil"><figcaption>Wrap bag</figcaption></figure></div></div>
</section>
</main>

<footer>
  <img class="logo" data-img="logo" alt="Naobil Coffee">
  <p>Coffee &amp; Daily Moments · © 2026 Naobil Coffee</p>
</footer>

const CATS=[['all','All Coffee'],['mc','Milk &amp; Classic'],['bl','Black Coffee'],['cb','Cold Brew &amp; Infused'],['nu','Nusantara Series'],['sg','Signature'],['br','Roti']];
const R=['8% 40% 46% 8%/7% 30% 36% 7%','10% 28% 50% 6%/8% 44% 26% 10%','6% 46% 30% 12%/10% 26% 44% 8%','12% 34% 40% 6%/6% 40% 32% 12%','8% 50% 36% 10%/9% 30% 40% 6%'];
const $=s=>document.querySelector(s),st=$('.stage'),wait=ms=>new Promise(r=>setTimeout(r,ms));
document.querySelectorAll('[data-img]').forEach(i=>i.src=IMG[i.dataset.img]);
let cat='all',sel='gulaaren',cart=0,token=0;
const list=()=>cat==='all'?P.filter(x=>x.g!=='br'):P.filter(x=>x.g===cat);
function replay(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}
function swapIn(p){
  const t=$('#ttl');t.innerHTML=p.l.map(w=>`<span>${w}</span>`).join('');
  $('#shot').src=IMG[p.k];$('#shot').alt=p.n;$('#desc').textContent=p.d;$('#comp').textContent=p.i?'Komposisi: '+p.i+'.':'';
  const L=list(),i=L.findIndex(x=>x.k===p.k);
  $('#sats').innerHTML=L.length>1?[1,2].map(n=>`<img class="sat" alt="" src="${IMG[L[(i+n)%L.length].k]}">`).join(''):'';
  [t,$('#shotf'),$('#sats')].forEach(e=>{e.classList.remove('out');replay(e,'in')});
}
async function pick(k,first){
  sel=k;const p=P.find(x=>x.k===k),tk=++token,L=list(),i=L.findIndex(x=>x.k===k);
  st.style.setProperty('--c',p.c);st.style.setProperty('--r',R[P.indexOf(p)%R.length]);
  const rw=$('#rows');rw.querySelectorAll('.row').forEach(r=>r.setAttribute('aria-pressed',r.dataset.k===k));
  const on=rw.querySelector('.row[aria-pressed="true"]');if(on)rw.scrollTo({top:on.offsetTop-80,behavior:'smooth'});
  $('#steps').innerHTML=L.map((x,j)=>`<i class="${j===i?'on':''}"></i>`).join('');
  $('#ctr').textContent=String(i+1).padStart(2,'0')+' / '+String(L.length).padStart(2,'0');
  if(!first){[$('#ttl'),$('#shotf')].forEach(e=>{e.classList.remove('in');void e.offsetWidth;e.classList.add('out')});$('#sats').classList.remove('in');await wait(420);if(tk!==token)return}
  swapIn(p);
}
function rows(){
  const rw=$('#rows');
  rw.innerHTML=list().map((p,i)=>`<div class="row" style="--i:${i}" role="button" tabindex="0" data-k="${p.k}" aria-pressed="${p.k===sel}"><span>${p.n}</span><small>${p.s}</small><img src="${IMG[p.k]}" alt=""><button class="add" aria-label="Tambah ${p.n}" data-add="1">+</button></div>`).join('');
  rw.classList.remove('out');replay(rw,'in');
}
$('#rows').addEventListener('click',e=>{
  const r=e.target.closest('.row');if(!r)return;
  if(e.target.closest('[data-add]')){cart++;$('#cnt').textContent=cart;replay($('#cnt'),'bump');setTimeout(()=>$('#cnt').classList.remove('bump'),250)}
  if(r.dataset.k!==sel)pick(r.dataset.k);
});
$('#rows').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('row')){e.preventDefault();pick(e.target.dataset.k)}});
$('#cats').innerHTML=CATS.map(([id,n])=>`<button class="cat" data-cat="${id}" aria-pressed="${id==='all'}">${n}</button>`).join('');
$('#cats').addEventListener('click',e=>{
  const b=e.target.closest('.cat');if(!b||cat===b.dataset.cat)return;
  cat=b.dataset.cat;document.querySelectorAll('.cat').forEach(x=>x.setAttribute('aria-pressed',x===b));
  $('#rows').classList.add('out');
  const L=list(),t=L.some(x=>x.k===sel)?sel:L[0].k;
  if(t!==sel)pick(t);else{sel='';pick(t,true)}
  setTimeout(rows,320);
});
const step=d=>{const L=list(),i=L.findIndex(x=>x.k===sel);pick(L[(i+d+L.length)%L.length].k)};
$('#next').onclick=()=>step(1);$('#prev').onclick=()=>step(-1);
rows();pick('gulaaren',true);
</script>
